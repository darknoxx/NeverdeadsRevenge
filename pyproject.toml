[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neverdeads-revenge"
version = "0.1.0"
description = "A terminal roguelite about Noxx and his revenge."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "darknoxx" }]
keywords = ["roguelite", "terminal", "tui", "textual", "game"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Role-Playing",
]

dependencies = ["textual>=8.0", "miniaudio>=1.71"]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-asyncio>=1.0"]

[project.scripts]
ndr = "neverdeads_revenge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neverdeads_revenge"]
# The sound effects are read at runtime, so they have to travel with the code
# rather than sitting in assets/ with the desktop file. Named explicitly so a
# future packaging change cannot quietly drop them and leave the game silent.
include = ["src/neverdeads_revenge/sounds/*.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
